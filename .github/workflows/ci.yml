name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the newest run for each PR (or branch push).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint TypeScript and Vue
        run: npm run lint

      - name: Run Worker unit tests
        run: npm run test:worker

      - name: Build frontend and type-check Worker
        run: npm run build
