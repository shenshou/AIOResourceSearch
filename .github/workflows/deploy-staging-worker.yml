name: Deploy staging Worker

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aio-resource-search-staging-worker
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: vars.STAGING_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_STAGING_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_STAGING_KV_NAMESPACE_ID }}
      CLOUDFLARE_STAGING_ALLOWED_ORIGIN: ${{ vars.CLOUDFLARE_STAGING_ALLOWED_ORIGIN }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID."; exit 1; }
          [[ "$CLOUDFLARE_STAGING_KV_NAMESPACE_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_STAGING_KV_NAMESPACE_ID must be a 32-character hexadecimal namespace ID."; exit 1; }
          [[ "$CLOUDFLARE_STAGING_ALLOWED_ORIGIN" =~ ^https://[^/]+$ ]] || { echo "CLOUDFLARE_STAGING_ALLOWED_ORIGIN must be an HTTPS origin without a path."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Worker unit tests
        run: npm run test:worker

      - name: Run Durable Object runtime tests
        run: npm run test:worker:runtime

      - name: Build frontend and type-check Worker
        run: npm run build

      - name: Prepare isolated staging configuration
        run: node scripts/prepare-staging-config.mjs

      - name: Validate staging Worker bundle
        run: npx wrangler deploy --dry-run --config apps/worker/wrangler.staging.local.jsonc

      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config apps/worker/wrangler.staging.local.jsonc

      - name: Record deployment summary
        run: |
          {
            echo "## Staging Worker deployment"
            echo "- Worker: aio-resource-search-api-staging"
            echo "- Branch: develop"
            echo "- KV: dedicated staging namespace"
            echo "- Cron: disabled in staging"
            echo "- Production resources: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
