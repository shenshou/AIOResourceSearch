name: Deploy production Worker

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aio-resource-search-production-worker
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PRODUCTION_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_PRODUCTION_KV_NAMESPACE_ID }}
      CLOUDFLARE_PRODUCTION_ALLOWED_ORIGIN: ${{ vars.CLOUDFLARE_PRODUCTION_ALLOWED_ORIGIN }}
    steps:
      - name: Check whether Production deployment is enabled
        id: deployment_gate
        shell: bash
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          if [[ "$PRODUCTION_DEPLOY_ENABLED" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Production deployment is disabled until production resources and secrets are ready."
          fi

      - name: Checkout verified main commit
        if: steps.deployment_gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect Worker-affecting changes
        if: steps.deployment_gate.outputs.enabled == 'true'
        id: worker_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || git diff --name-only HEAD^ HEAD | grep -Eq '^(apps/worker/|packages/shared/|scripts/prepare-production-config\.mjs$|package\.json$|package-lock\.json$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No Worker-affecting files changed; Pages deployment is handled independently."
          fi

      - name: Set up Node.js
        if: steps.deployment_gate.outputs.enabled == 'true' && steps.worker_changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate deployment configuration
        if: steps.deployment_gate.outputs.enabled == 'true' && steps.worker_changes.outputs.deploy == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID."; exit 1; }
          [[ "$CLOUDFLARE_PRODUCTION_KV_NAMESPACE_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "CLOUDFLARE_PRODUCTION_KV_NAMESPACE_ID must be a 32-character hexadecimal namespace ID."; exit 1; }
          [[ "$CLOUDFLARE_PRODUCTION_ALLOWED_ORIGIN" =~ ^https://[^/]+$ ]] || { echo "CLOUDFLARE_PRODUCTION_ALLOWED_ORIGIN must be an HTTPS origin without a path."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret."; exit 1; }

      - name: Install dependencies
        if: steps.deployment_gate.outputs.enabled == 'true' && steps.worker_changes.outputs.deploy == 'true'
        run: npm ci

      - name: Prepare production configuration
        if: steps.deployment_gate.outputs.enabled == 'true' && steps.worker_changes.outputs.deploy == 'true'
        run: node scripts/prepare-production-config.mjs

      - name: Validate production Worker bundle
        if: steps.deployment_gate.outputs.enabled == 'true' && steps.worker_changes.outputs.deploy == 'true'
        run: npx wrangler deploy --dry-run --config apps/worker/wrangler.production.local.jsonc

      - name: Deploy production Worker
        if: steps.deployment_gate.outputs.enabled == 'true' && steps.worker_changes.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config apps/worker/wrangler.production.local.jsonc

      - name: Record deployment summary
        if: steps.deployment_gate.outputs.enabled == 'true' && steps.worker_changes.outputs.deploy == 'true'
        run: |
          {
            echo "## Production Worker deployment"
            echo "- Worker: aio-resource-search-api"
            echo "- Branch: main"
            echo "- KV: dedicated production namespace"
            echo "- Cron: enabled (15-minute schedule)"
            echo "- Source enablement and KV initialization: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
